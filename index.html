<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Life HQ">
<meta name="theme-color" content="#F4EFE7">
<title>Life HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Hanken+Grotesk:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --base:#ECEAF2;
  --ink:#1B1A17; --ink2:#4F4B44; --ink3:#6B665C;
  --glass:rgba(255,255,255,.5); --glass-b:rgba(255,255,255,.78);
  --dark:#1C1B18; --dark2:#2A2925; --dark3:#36352F; --on-dark:#F4EEE3; --on-dark2:#ADA79A;
  --sun:#FFC83D; --sun-soft:#FFF4D2; --sun-ink:#5A4508;
  --tang:#FF6A2C; --tang-soft:#FFE2D4;
  --lav:#CDBFFC; --lav-deep:#6450DA; --lav-soft:#ECE6FF;
  --mint:#23A873; --mint-soft:#D9F2E6;
  --paper:#FFFFFF; --day:#F1EEF6;
  --shadow:0 22px 44px -22px rgba(70,45,20,.32),0 2px 6px rgba(70,45,20,.05);
  --th:'Anuphan','Noto Sans Thai','Sukhumvit Set','Thonburi',system-ui,sans-serif;
  --num:'Bricolage Grotesque','Anuphan','Noto Sans Thai',system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scrollbar-color:#D3CEE0 transparent;scrollbar-width:thin}
body{font-family:var(--th);color:var(--ink);background:var(--base);line-height:1.6;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--sun);color:var(--ink)}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:10px}
.dark :focus-visible{outline-color:var(--sun)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px)}
.o1{width:560px;height:560px;background:#FFC9A8;top:-200px;left:-160px;opacity:.9}
.o2{width:620px;height:620px;background:#D6CAFF;top:-180px;right:-220px;opacity:.85}
.o3{width:560px;height:560px;background:#BCD7FF;bottom:-240px;left:30%;opacity:.75}
.o4{width:380px;height:380px;background:#FFE08F;top:38%;left:-120px;opacity:.55}

.shell{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 28px 44px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font:800 19px var(--num);letter-spacing:-.02em;text-decoration:none}
.mark{width:36px;height:36px;display:block}
.nav{display:flex;gap:4px;background:var(--dark);padding:5px;border-radius:999px;box-shadow:var(--shadow)}
.nav a{color:var(--on-dark2);text-decoration:none;font-size:14px;font-weight:500;padding:8px 18px;border-radius:999px;transition:background .25s var(--ease),color .25s var(--ease);white-space:nowrap}
.nav a:hover{color:var(--on-dark)}
.nav a[aria-current="true"]{background:var(--sun);color:var(--ink)}
.tools{display:flex;align-items:center;gap:10px}
.stamp{font-size:13px;color:var(--ink3);white-space:nowrap}
.avs{display:flex}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--num);border:2px solid var(--base);flex-shrink:0}
.av+.av{margin-left:-10px}
.av.ack{background:var(--sun);color:var(--ink)}
.av.nook{background:var(--lav-deep);color:#fff}
.dark .av{border-color:var(--dark2)}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);text-decoration:none;color:var(--ink);transition:transform .3s var(--ease)}
.iconbtn:hover{transform:rotate(-30deg)}

.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:34px 0 24px}
.hello h1{font-weight:600;font-size:clamp(34px,4.8vw,56px);line-height:1.2}
.hello p{color:var(--ink2);font-size:17px;margin-top:4px}
.summary{display:flex;gap:8px;flex-wrap:wrap}
.sumchip{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:999px;padding:7px 14px 7px 8px;font-size:14px}
.sumchip b{font:700 13px var(--num);min-width:26px;height:26px;border-radius:999px;display:grid;place-items:center;padding:0 7px}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c-sales{grid-column:span 7}.c-next{grid-column:span 5}
.c-pending{grid-column:span 7;grid-row:span 2}.c-cake{grid-column:span 5}.c-shop{grid-column:span 5}
.c-week{grid-column:span 12}.c-doing{grid-column:span 12}

.card{position:relative;border-radius:28px;padding:24px;overflow:hidden;scroll-margin-top:20px}
.glass{background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%)}
.solid{box-shadow:var(--shadow)}
.dark{background:var(--dark);color:var(--on-dark)}
.c-pending{display:flex;flex-direction:column}
.c-pending .hint{margin-top:auto;padding-top:18px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h2{font-size:17px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:10px}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--ink);color:var(--sun)}
.dark .ic{background:var(--sun);color:var(--ink)}
.count{font:700 12px var(--num);background:var(--ink);color:var(--on-dark);min-width:24px;height:24px;border-radius:999px;display:inline-grid;place-items:center;padding:0 8px}
.dark .count{background:var(--sun);color:var(--ink)}
.go{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(27,26,23,.16);text-decoration:none;transition:background .25s var(--ease),color .25s var(--ease),transform .35s var(--ease)}
.go:hover{background:var(--ink);color:var(--sun);transform:rotate(45deg)}
.go svg{width:16px;height:16px}
.empty{display:flex;align-items:center;gap:12px;padding:18px;border-radius:20px;border:1.5px dashed rgba(27,26,23,.18);color:var(--ink2);font-size:15px}
.empty .ic{width:32px;height:32px;background:var(--mint-soft);color:var(--mint)}
.dark .empty{border-color:rgba(244,238,227,.2);color:var(--on-dark2)}

/* sales */
.big{font:800 clamp(46px,5.6vw,68px)/1 var(--num);letter-spacing:-.015em;font-variant-numeric:tabular-nums;display:flex;align-items:flex-start;gap:6px}
.big small{font-size:.36em;font-weight:700;color:var(--ink3);letter-spacing:0;margin-top:.35em}
.sub{color:var(--ink2);font-size:15px;margin-top:10px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-top:26px}
.bar{display:flex;flex-direction:column;align-items:center;gap:10px}
.track{height:150px;width:100%;max-width:56px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;padding:6px;border-radius:18px;background:rgba(27,26,23,.05)}
.fill{width:100%;border-radius:12px;background:var(--ink);height:var(--h);min-height:8px;transform-origin:bottom;position:relative}
.fill.today{background:var(--sun);box-shadow:0 10px 24px -8px rgba(255,170,30,.7)}
.fill.none{height:30%;background:repeating-linear-gradient(135deg,rgba(27,26,23,.16) 0 2px,transparent 2px 8px);border:1.5px dashed rgba(27,26,23,.28)}
.fill[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--on-dark);font:500 12px var(--th);padding:6px 10px;border-radius:10px;white-space:nowrap;z-index:5}
.peak{font:700 12px var(--num);font-variant-numeric:tabular-nums;background:var(--ink);color:var(--on-dark);padding:3px 8px;border-radius:999px;white-space:nowrap}
.lbl{font-size:13px;color:var(--ink3)}
.lbl.on{color:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--ink3)}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block;vertical-align:-1px;margin-right:6px}
.sw.ink{background:var(--ink)}.sw.sun{background:var(--sun)}
.sw.hatch{background:repeating-linear-gradient(135deg,rgba(27,26,23,.3) 0 1.5px,transparent 1.5px 4px);border:1px dashed rgba(27,26,23,.35)}

/* next */
.next{background:var(--sun);display:flex;flex-direction:column;min-height:300px;isolation:isolate}
.waves{position:absolute;right:-90px;bottom:-110px;width:330px;height:330px;border-radius:50%;z-index:-1;
  background:repeating-radial-gradient(circle at 70% 70%,#FF6A2C 0 13px,#FF8A3A 13px 26px,#FFA24A 26px 39px);
  -webkit-mask-image:radial-gradient(circle at 70% 70%,#000 35%,transparent 70%);mask-image:radial-gradient(circle at 70% 70%,#000 35%,transparent 70%);opacity:.95}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font:700 15px var(--num)}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--sun-soft);border-radius:999px;padding:6px 13px 6px 9px;font:600 13px var(--th);white-space:nowrap}
.pill svg{color:var(--tang);width:17px;height:17px}
.next h3{font-size:clamp(28px,2.8vw,38px);line-height:1.25;font-weight:700;padding-top:22px;max-width:86%}
.note{color:var(--sun-ink);font-size:15px;margin-top:8px;max-width:86%}
.later{margin-top:auto;padding-top:20px}
.later-in{background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.55);border-radius:20px;padding:6px 14px;max-width:88%}
.lt{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;border-top:1px solid rgba(27,26,23,.1)}
.lt:first-child{border-top:0}
.lt b{font:700 12.5px var(--num);min-width:92px;color:var(--sun-ink)}
.lt span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--sun);font:600 14px var(--th);padding:11px 18px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;transition:transform .3s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink);padding:11px 10px}
.btn.ghost:hover{text-decoration:underline;text-underline-offset:4px;transform:none}

/* pending */
.tabs{display:flex;gap:3px;background:var(--base);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;font:500 13px var(--th);color:var(--ink2);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .25s var(--ease)}
.tabs button[aria-pressed="true"]{background:var(--sun);color:var(--ink)}
.tabs .n{font:700 11px var(--num);background:rgba(27,26,23,.1);border-radius:999px;padding:1px 7px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:20px;background:var(--dark2);transition:background .25s var(--ease),transform .35s var(--ease)}
.row:hover{background:var(--dark3);transform:translateX(3px)}
.row[hidden]{display:none}
.row .av{width:40px;height:40px;font-size:14px;border:0}
.t{font-size:15.5px;font-weight:500;line-height:1.45}
.m{font-size:13px;color:var(--on-dark2);display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.scope{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.wait{font:600 12px var(--th);border:1px dashed rgba(244,238,227,.35);color:var(--on-dark);padding:5px 12px;border-radius:999px;white-space:nowrap}
.wait.hot{border:0;background:var(--tang);color:var(--ink)}
.hint{margin-top:18px;font-size:13px;color:var(--on-dark2);display:flex;align-items:center;gap:8px;line-height:1.5}
.hint svg{width:16px;height:16px}

/* doing */
.lav{background:var(--lav)}
.doing-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:36px;align-items:start}
.doing-in .head{margin-bottom:22px}
.doing-note{font-size:14px;color:var(--ink2);margin-top:14px;line-height:1.55}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);margin-bottom:8px}
.prog b{font:700 14px var(--num);color:var(--ink)}
.bar2{height:12px;border-radius:999px;background:rgba(27,26,23,.12);overflow:hidden;margin-bottom:8px}
.bar2 i{display:block;height:100%;border-radius:999px;background:var(--ink);width:var(--w);transform-origin:left}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(27,26,23,.12)}
.li:first-of-type{border-top:0}
.li .av{width:30px;height:30px;font-size:12px;border:0}
.li .t{font-size:15px;flex:1;min-width:0}
.status{font:600 12px var(--th);padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.6);white-space:nowrap}
.status.on{background:var(--ink);color:var(--lav)}

/* cake + shop */
.items{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:20px;background:rgba(255,255,255,.62)}
.item .ic{width:40px;height:40px;background:var(--tang-soft);color:var(--tang)}
.item h4{font-size:15.5px;font-weight:600;line-height:1.4}
.item p{font-size:14px;color:var(--ink2);line-height:1.5}
.item .warn{color:#B4400F}
.tag{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--th);background:var(--ink);color:var(--on-dark);border-radius:999px;padding:3px 10px;margin-left:auto;white-space:nowrap;align-self:flex-start}
.tag.hot{background:var(--tang);color:var(--ink)}
.shop{display:flex;flex-direction:column}
.si{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid rgba(27,26,23,.1);font-size:15px}
.si:first-child{border-top:0}
.ring{width:20px;height:20px;border-radius:50%;border:2px solid rgba(27,26,23,.35);flex-shrink:0}
.si.hot .ring{border-color:var(--tang);background:var(--tang-soft)}
.si .q{margin-left:auto;font:600 14px var(--num);color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.si .hotl{font:600 11px var(--th);color:#B4400F;background:var(--tang-soft);border-radius:999px;padding:1px 8px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--ink3)}

/* week */
.paper{background:var(--paper)}
.leg{display:flex;gap:14px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.leg span{display:inline-flex;align-items:center;gap:6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin:0 -4px;padding-inline:4px}
.days::-webkit-scrollbar{height:6px}.days::-webkit-scrollbar-thumb{background:#D9D5E4;border-radius:9px}
.day{scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;min-height:170px}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--day);font:700 15px var(--num);flex-shrink:0}
.day.today .dn{background:var(--ink);color:var(--sun)}
.dw{font-size:13px;color:var(--ink3);line-height:1.3}
.day.today .dw{color:var(--ink);font-weight:600}
.ev{border-radius:16px;padding:9px 11px;font-size:13.5px;line-height:1.4}
.ev b{display:block;font:700 12px var(--num);margin-bottom:2px}
.ev.ack{background:var(--sun-soft)} .ev.nook{background:var(--lav-soft)} .ev.main{background:var(--mint-soft)}
.ev .dot{margin-right:6px;vertical-align:1px}
.free{flex:1;min-height:64px;border-radius:16px;border:1.5px dashed #E2DEEC}

.footer{margin-top:26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink3)}
.footer a{color:var(--ink2);text-underline-offset:4px}

@media (prefers-reduced-motion:no-preference){
  .rise{animation:rise .9s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
  @keyframes rise{from{opacity:.35;transform:translateY(18px) scale(.985);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
  .fill:not(.none){animation:grow 1s var(--ease) both;animation-delay:calc(.3s + var(--b,0) * 55ms)}
  .bar2 i{animation:grow-x 1.1s var(--ease) .45s both}
  @keyframes grow{from{transform:scaleY(.04)}to{transform:none}}
  @keyframes grow-x{from{transform:scaleX(.04)}to{transform:none}}
}

@media (max-width:980px){
  .grid>.card{grid-column:span 12;grid-row:auto}
  .c-next{order:1}.c-pending{order:2}.c-sales{order:3}.c-cake{order:4}.c-shop{order:5}.c-doing{order:6}.c-week{order:7}
  .doing-in{grid-template-columns:1fr;gap:6px}
  .days{grid-template-columns:repeat(7,minmax(132px,1fr))}
}
@media (max-width:640px){
  .shell{padding:max(16px,env(safe-area-inset-top)) 16px 32px}
  .top{flex-wrap:wrap}
  .nav{order:3;width:100%}
  .nav a{flex:1;text-align:center;padding:8px 6px}
  .stamp{display:none}
  .hello{margin:22px 0 16px}
  .card{padding:20px;border-radius:24px}
  .bars{gap:7px}
  .track{height:112px}
  .row{grid-template-columns:auto minmax(0,1fr);padding:13px 14px}
  .row .wait{grid-column:2;justify-self:start}
  .next{min-height:270px}
  .next h3,.note{max-width:100%}
  .waves{opacity:.55}
  .track{height:120px;padding:4px;border-radius:14px}
  .later-in{max-width:100%}
}

/* ---- Theme C: soft-focus grain ---- */
:root{
  --base:#F4EFE7;
  --ink:#1E1F24; --ink2:#3E404A; --ink3:#5A5D69;
  --glass:rgba(255,255,255,.52); --glass-b:rgba(255,255,255,.85);
  --dark:#2447D6; --dark2:rgba(255,255,255,.12); --dark3:rgba(255,255,255,.2); --on-dark:#FFFFFF; --on-dark2:#E3E9FF;
  --sun:#FFE08A; --sun-soft:rgba(255,255,255,.6); --sun-ink:#5B2E1E;
  --tang:#FF7A59; --tang-soft:#FFE3D8;
  --lav:#DDF0E6; --lav-deep:#FF8A6B; --lav-soft:#FFE6DD;
  --mint:#3FA978; --mint-soft:#DDF3E6;
  --cobalt:#2447D6; --sky:#A9C8FF;
  --paper:rgba(255,255,255,.6); --day:rgba(255,255,255,.75);
  --shadow:0 26px 50px -30px rgba(60,50,80,.35);
  --num:'Hanken Grotesk','Anuphan','Noto Sans Thai',system-ui,sans-serif;
  --serif:'Instrument Serif','Anuphan',Georgia,serif;
}
.orb{filter:blur(90px)}
.o1{width:620px;height:620px;background:#FFC1A6;top:-200px;left:-180px;opacity:.95}
.o2{width:640px;height:640px;background:#A9C8FF;top:-160px;right:-200px;opacity:.9}
.o3{width:600px;height:600px;background:#F8B4CF;bottom:-240px;left:30%;opacity:.8}
.o4{width:440px;height:440px;background:#FFE7A3;top:40%;left:-140px;opacity:.75}

function sales(i){
  var days=DATA.salesByDay||[];
  var rep=days.filter(function(d){return d.total!=null&&d.total!=='';});
  var total=rep.reduce(function(a,d){return a+Number(d.total);},0);
  var max=Math.max.apply(null,rep.map(function(d){return Number(d.total);}).concat([1]));
  var bars=days.map(function(d,k){
    var dt=pd(d.date), isT=dd(TODAY,dt)===0, lbl='<span class="lbl'+(isT?' on':'')+'">'+(isT?'วันนี้':DAY_S[dt.getDay()])+'</span>';
    if(d.total==null||d.total==='') return '<div class="bar"><div class="track"><div class="fill none" data-tip="'+sd(dt)+' · ยังไม่แจ้งยอด"></div></div>'+lbl+'</div>';
    var v=Number(d.total), pct=Math.max(7,Math.round(v/max*80));
    return '<div class="bar"><div class="track">'+(v===max?'<span class="peak">$'+money(v)+'</span>':'')+
      '<div class="fill'+(isT?' today':'')+'" style="--h:'+pct+'%;--b:'+k+'" data-tip="'+sd(dt)+' · $'+money(v)+'"></div></div>'+lbl+'</div>';
  }).join('');
  var big=rep.length?'<div class="big num"><small>A$</small>'+money(total)+'</div><p class="sub">'+I('avg')+'เฉลี่ย $'+money(total/rep.length)+' ต่อวัน · แจ้งยอดแล้ว '+rep.length+' จาก 7 วัน</p>'
    :'<div class="big num"><small>A$</small>—</div><p class="sub">ยังไม่มียอดขายใน 7 วันนี้ จะเริ่มขึ้นเมื่อดึงยอดจากอีเมล ePOS ได้</p>';

    '<a class="go" href="'+SHEET_URL+'" target="_blank" rel="noopener" aria-label="เปิดตารางยอดขาย">'+I('out')+'</a></div>'+

function week(i){
  var ev=[];
  ['ack','nook','main'].forEach(function(k){((DATA.calendars||{})[k]||[]).forEach(function(e){var d=pd(e.start);if(d) ev.push({d:d,t:timed(e.start)&&!e.allDay,k:k,title:e.title});});});
  var cols='';
  for(var n=0;n<7;n++){
    var day=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()+n);
    var todays=ev.filter(function(x){return dd(day,x.d)===0;}).sort(function(a,b){return a.d-b.d;});
    cols+='<div class="day'+(n===0?' today':'')+'"><div class="dh"><span class="dn">'+day.getDate()+'</span><span class="dw">'+(n===0?'วันนี้':n===1?'พรุ่งนี้':DAY_L[day.getDay()])+'<br>'+MON_S[day.getMonth()]+'</span></div>'+
      (todays.length?todays.map(function(x){return '<div class="ev '+x.k+'"><b>'+I(x.t?'clock':'sun')+(x.t?hm(x.d):'ทั้งวัน')+'</b>'+esc(x.title)+'</div>';}).join(''):'<div class="free" aria-label="ว่าง">'+I('moon')+'ว่าง</div>')+'</div>';
  }
  return '<section class="card paper solid c-week rise" id="week" style="--i:'+i+'" aria-labelledby="h-week">'+
    '<div class="head"><h2 id="h-week"><span class="ic">'+I('cal')+'</span>7 วันข้างหน้า</h2>'+
    '<div class="leg"><span><i class="dot" style="background:#F5C64A"></i>แอค</span><span><i class="dot" style="background:#FF8A6B"></i>นุ๊ก</span><span><i class="dot" style="background:#7C98FF"></i>ปฏิทินร่วม</span></div></div>'+
    '<div class="days">'+cols+'</div></section>';
}

(function(){
  var motion=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

  // stagger the inside of each card after the card itself arrives
  var cards=document.querySelectorAll('.card');
  for(var c=0;c<cards.length;c++){
    var ci=parseFloat(cards[c].style.getPropertyValue('--i'))||0;
    var kids=cards[c].querySelectorAll('.row,.item,.si,.li,.day,.lt');
    for(var k=0;k<kids.length;k++){kids[k].style.setProperty('--d',(0.32+ci*0.07+k*0.05).toFixed(2)+'s');if(motion)kids[k].classList.add('st');}
  }

  // once an entrance finishes, drop it so hover/press transforms can take over
  document.addEventListener('animationend',function(e){var m={rise:'rise',st:'st',re:'re'}[e.animationName];if(m&&e.target.classList)e.target.classList.remove(m);});

  // count numbers up
  function countUp(el,to,dur,fmt){
    if(!motion){el.textContent=fmt(to);return;}
    var t0=null;function step(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(2,-10*p);el.textContent=fmt(to*(p===1?1:e));if(p<1)requestAnimationFrame(step);}
    el.textContent=fmt(0);requestAnimationFrame(step);setTimeout(function(){el.textContent=fmt(to);},dur+120);
  }
  var big=document.querySelector('.c-sales .big');
  if(big){var tn=big.lastChild;var v=Number(String(tn.textContent).replace(/[^0-9.]/g,''));
    if(tn.nodeType===3&&v){var span=document.createElement('span');span.className='n';big.replaceChild(span,tn);setTimeout(function(){countUp(span,v,1400,money);},250);}}
  var chips=document.querySelectorAll('.sumchip b,.count');
  for(var q=0;q<chips.length;q++){(function(el){var n=parseInt(el.textContent,10);if(n>0)setTimeout(function(){countUp(el,n,900,function(x){return String(Math.round(x));});},350);})(chips[q]);}

  // sliding nav pill + scroll spy
  var nav=document.querySelector('.nav'),pill=nav.querySelector('.navpill'),links=nav.querySelectorAll('a');
  function place(a){pill.style.width=a.offsetWidth+'px';pill.style.transform='translateX('+a.offsetLeft+'px)';pill.style.opacity=1;}
  function setCurrent(id){for(var i=0;i<links.length;i++){var on=links[i].getAttribute('data-jump')===id;links[i].setAttribute('aria-current',on?'true':'false');if(on)place(links[i]);}}
  nav.classList.add('ready');setCurrent('top');
  window.addEventListener('resize',function(){var a=nav.querySelector('[aria-current="true"]');if(a)place(a);});
  var spyIds=['sales','tasks','cakes'],lock=0;
  function spy(){if(Date.now()<lock)return;var cur='top';if(window.scrollY>140){for(var i=0;i<spyIds.length;i++){var el=document.getElementById(spyIds[i]);if(el&&el.getBoundingClientRect().top<window.innerHeight*0.35)cur=spyIds[i];}}
    var a=nav.querySelector('[aria-current="true"]');if(!a||a.getAttribute('data-jump')!==cur)setCurrent(cur);}

  // parallax on the cloud scene
  var deco=document.querySelector('.deco'),px=0,py=0,ticking=false;
  function paint(){ticking=false;spy();if(deco&&motion)deco.style.transform='translate('+px+'px,'+(py-window.scrollY*0.06)+'px) rotate('+(window.scrollY*0.01)+'deg)';}
  window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(paint);}},{passive:true});
  var nextCard=document.querySelector('.c-next');
  if(nextCard&&deco&&motion&&window.matchMedia('(hover:hover)').matches){
    nextCard.addEventListener('pointermove',function(e){var b=nextCard.getBoundingClientRect();px=((e.clientX-b.left)/b.width-.5)*-16;py=((e.clientY-b.top)/b.height-.5)*-12;requestAnimationFrame(paint);});
    nextCard.addEventListener('pointerleave',function(){px=0;py=0;requestAnimationFrame(paint);});
  }

  // nav click: move the pill straight away and hold the spy until scrolling settles
  document.addEventListener('click',function(e){var j=e.target.closest('.nav [data-jump]');if(j){lock=Date.now()+900;setCurrent(j.getAttribute('data-jump'));}},true);

  // replay row entrance when filtering
  document.addEventListener('click',function(e){var b=e.target.closest('.tabs button');if(!b||!motion)return;
    setTimeout(function(){var rs=document.querySelectorAll('#prow .row:not([hidden])');for(var i=0;i<rs.length;i++){rs[i].classList.remove('st','re');void rs[i].offsetWidth;rs[i].style.setProperty('--d',(i*0.05)+'s');rs[i].classList.add('re');}},0);});

  // refresh: spin, then go
  var rf=document.getElementById('refresh');
  rf.addEventListener('click',function(){rf.classList.add('spin');});

  // pull to refresh (touch)
  var pull=document.getElementById('pull'),y0=null,dy=0;
  window.addEventListener('touchstart',function(e){y0=window.scrollY<=0?e.touches[0].clientY:null;dy=0;},{passive:true});
  window.addEventListener('touchmove',function(e){if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy<=0){pull.style.opacity=0;return;}
    var m=Math.min(dy*0.5,90);pull.style.transition='none';pull.style.opacity=Math.min(1,dy/120);
    pull.style.transform='translateY('+(m-50)+'px) rotate('+(dy*1.6)+'deg)';},{passive:true});
  window.addEventListener('touchend',function(){if(y0===null)return;pull.style.transition='transform .5s var(--ease),opacity .4s';
    if(dy>140){pull.classList.add('spin');pull.style.transform='translateY(30px)';rf.classList.add('spin');setTimeout(function(){rf.click();},350);}
    else{pull.style.transform='translateY(-60px)';pull.style.opacity=0;}y0=null;});
})();
}
(function(){
  var API = window.LIFEHQ_API || "https://script.google.com/macros/s/AKfycbxd28K0Fid3VPFyRahKD3fFpgxRQCnKMZCGQRFH6MUTX18UkF-RmoELjGAWbkuALGvcyA/exec";
  var gate = document.getElementById('gate'), form = document.getElementById('gate-form'), keyIn = document.getElementById('gate-key'),
      err = document.getElementById('gate-err'), title = document.getElementById('gate-title'), msg = document.getElementById('gate-msg'),
      retry = document.getElementById('gate-retry');
  function getKey(){ try { return localStorage.getItem('lifehq_key') || ''; } catch (e) { return ''; } }
  function setKey(k){ try { if (k) localStorage.setItem('lifehq_key', k); else localStorage.removeItem('lifehq_key'); } catch (e) {} }
  function ask(text){ gate.classList.remove('loading'); title.textContent = 'Life HQ'; msg.textContent = 'ใส่รหัสครั้งแรกครั้งเดียว เครื่องนี้จะจำไว้';
    form.hidden = false; retry.hidden = true; err.textContent = text || ''; keyIn.value = ''; setTimeout(function(){ keyIn.focus(); }, 50); }
  function fail(){ gate.classList.remove('loading'); title.textContent = 'โหลดข้อมูลไม่ได้'; msg.textContent = 'เช็กอินเทอร์เน็ต แล้วลองอีกครั้ง'; form.hidden = true; retry.hidden = false; }
  function load(k){
    gate.classList.add('loading'); form.hidden = true; retry.hidden = true; title.textContent = 'กำลังโหลด…'; msg.textContent = 'ดึงข้อมูลล่าสุดจาก Sheet และ Calendar';
    fetch(API + (API.indexOf('?') < 0 ? '?' : '&') + 'format=json&k=' + encodeURIComponent(k), { cache: 'no-store' })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (!data || data.error) { setKey(''); ask('รหัสไม่ถูก ลองใหม่อีกครั้ง'); return; }
        setKey(k); boot(data); gate.classList.add('gone');
      })
      .catch(fail);
  }
  form.addEventListener('submit', function(e){ e.preventDefault(); var k = keyIn.value.trim(); if (!k) { err.textContent = 'ใส่รหัสก่อน'; return; } load(k); });
  keyIn.addEventListener('input', function(){ err.textContent = ''; });
  retry.addEventListener('click', function(){ load(getKey()); });
  var k = getKey(); if (k) load(k); else ask();
})();
</script>
